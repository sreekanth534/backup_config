hostname BRBN1-SW01
!
interface GigabitEthernet0/0/0
 description switch_uplink
 ip address 1.1.1.1
 no negotiation auto
 speed 1000
 !
interface GigabitEthernet0/0/1
 description switch_uplink
 ip address 2.1.1.1
 no negotiation auto
 speed 1000
 !
interface GigabitEthernet0/0/2
 description switch_uplink
 ip address 3.1.1.1
 no negotiation auto
 speed 1000
 shutdown
 !
sampler Neustar_Sampler
flow exporter IPFix-Neustar
destination 2.2.2.2
interface Tunnel61
 ip add 2.2.2.2
interface Tunnel62
  ip add 2.2.2.3
interface Tunnel63
  ip add 2.2.2.4
router bgp
 neighbor NEUSTAD
 neighbor ISP
 neighbor IBGP
 neighbor 74.115
 neighbor 5.5.5.5
 neighbor 6.6.6.6

